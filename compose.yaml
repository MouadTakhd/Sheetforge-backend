
services:
  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
  ###< doctrine/doctrine-bundle ###

  backend:
    build:
      context: .
      target: app_php
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-!ChangeMe!}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8

      # Webserver Runtime Limits Modifications
      PHP_INI_UPLOAD_MAX_FILESIZE: "100M"
      PHP_INI_POST_MAX_SIZE: "108M"
      PHP_INI_MEMORY_LIMIT: "512M"
      PHP_INI_MAX_EXECUTION_TIME: "300"

      AWS_S3_KEY: ${AWS_S3_KEY:-local_s3_user}
      AWS_S3_SECRET: ${AWS_S3_SECRET:-local_s3_password}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-conversion-bucket}
      AWS_S3_ENDPOINT: http://s3:9000
    volumes:
      - .:/srv/app:rw
    ports:
      - "8000:80"
    depends_on:
      database:
        condition: service_healthy
      s3:
        condition: service_started

  # Dedicated Local Cloud Storage Engine
  s3:
    image: minio/minio:latest
    container_name: sheetforge_storage
    ports:
      - "9000:9000"       # S3 API operations endpoint
      - "9001:9001"       # Visual Web Console Dashboard interface
    environment:
      MINIO_ROOT_USER: ${AWS_S3_KEY:-local_s3_user}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET:-local_s3_password}
    volumes:
      - s3_data:/data
    command: server /data --console-address ":9001"

  # ─── THE BULLETPROOF AUTO-INITIALIZATION SERVICE ───
  storage_init:
    image: minio/mc:latest
    container_name: sheetforge_storage_init
    depends_on:
      - s3
    environment:
      S3_KEY: ${AWS_S3_KEY:-local_s3_user}
      S3_SECRET: ${AWS_S3_SECRET:-local_s3_password}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      until mc alias set sheetforge_local http://s3:9000 \$S3_KEY \$S3_SECRET; do
        echo 'MinIO not ready, retrying in 2s...';
        sleep 2;
      done;

      echo 'Creating bucket...';
      mc mb --ignore-existing sheetforge_local/conversion-bucket;

      echo 'Setting private policy...';
      mc anonymous set private sheetforge_local/conversion-bucket;

      echo 'Injecting public avatars policy...';
      echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicAvatars\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::conversion-bucket/*/avatars/*\"]}]}' > /tmp/p.json;
      mc policy set-json /tmp/p.json sheetforge_local/conversion-bucket;

      echo 'Done!';
      "

volumes:
  database_data:
  s3_data:
