api_platform:

    title: Hello API Platform
    version: 1.0.0
    defaults:
        platform_version: '%env(PLATFORM_VERSION)%'
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']
